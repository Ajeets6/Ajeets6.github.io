project:
  type: website
  execute-dir: project
  output-dir: _site
  render:
    - "*.qmd"
    - "posts/**/*.qmd"
    - "posts/**/*.md"
    - "!site_audit/**"

website:
  title: "Ajeet Singh"
  site-url: "https://ajeets6.github.io"
  description: "AI and software engineer building retrieval, computer vision, and systems software."
  favicon: favicon.svg
  search: true
  open-graph: true
  twitter-card: true
  navbar:
    pinned: true
    collapse: true
    right:
      - text: Work
        href: index.qmd#work
      - text: Knowledge
        href: index.qmd#knowledge
      - text: Experience
        href: index.qmd#experience
      - text: Projects
        href: projects.qmd
      - text: Contact
        href: mailto:ajeetsingh6234@gmail.com
  sidebar:
    style: docked
    collapse-level: 1
    alignment: left
    contents:
      - section: Projects
        contents:
          - file: posts/multi-modal-rag/rag.md
          - file: posts/dashboard-llm/dash.md
          - file: posts/chip8-raylib/chip8.qmd
          - file: posts/aerialAI/aerial.md
          - file: posts/GurmukhiSLM/gurmukhi.md
  page-footer:
    left: "© 2026 Ajeet Singh"
    right:
      - text: GitHub
        href: https://github.com/Ajeets6
      - text: LinkedIn
        href: https://www.linkedin.com/in/ajeetsingh6
      - text: Contact
        href: mailto:ajeetsingh6234@gmail.com

format:
  html:
    theme: [darkly, theme.scss]
    css: styles.css
    code-blocks: true
    code-copy: true
    toc-location: right
    anchor-sections: true
    smooth-scroll: true
    canonical-url: true
    embed-resources: false
    page-layout: article
    grid:
      sidebar-width: 270px
      body-width: 900px
      margin-width: 250px
      gutter-width: 2.5rem
