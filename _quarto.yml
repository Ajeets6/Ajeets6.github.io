project:
  type: website
  execute-dir: project

website:
  title: "Ajeet Singh"
  favicon: favicon.svg
  navbar:
    background: secondary
    right:
      - projects.qmd
      - icon: github
        href: https://github.com/Ajeets6
      - icon: linkedin
        href: https://www.linkedin.com/in/ajeetsingh6
    pinned: true
    collapse: false
  sidebar:
    style: "docked"
    collapse-level: 1
    search: true

    alignment: center
    contents:
    - section: "Posts"
      contents:
        - file: posts/multi-modal-rag/rag.md
        - file: posts/dashboard-llm/dash.md
        - file: posts/chip8-raylib/chip8.qmd


format:
  html:
    mainfont: "'Roboto Flex'"
    code-blocks: true
    embed-resources: false
    page-layout: article
    theme:
      dark: [darkly,dark.scss]
      light: [darkly,light.scss]
    highlight-style:
      light: github
    include-in-header:
      file: header.html
    include-after-body: three.html
    grid:
      sidebar-width: 300px
      body-width: 1000px
      margin-width: 300px
    css: styles.css



