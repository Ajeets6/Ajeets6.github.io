project:
  type: website

website:
  title: "Projects"
  navbar:
    background: secondary
    right:
      - about.qmd
      - icon: github
        href: https://github.com/Ajeets6
      - icon: linkedin
        href: https://www.linkedin.com/in/ajeetsingh6
    pinned: true
    collapse: false
  sidebar:
    style: "docked"
    collapse-level: 1
    search: true

    alignment: center
    contents:
    - auto: posts

format:
  html:
    mainfont: "'Roboto Flex'"
    
    embed-resources: true
    page-layout: article
    theme:
      dark: [darkly,dark.scss]
      light: [darkly]
    include-in-header:
      file: header.html

    grid:
      sidebar-width: 300px
      body-width: 1000px
      margin-width: 300px
    css: styles.css



